<!DOCTYPE html>
<html>

<head>
    <title>Server Computation</title>
</head>

<body>

    <h1>Hana Tolera uses a fetch request</h1>

    <input type="number" id="x">
    <input type="number" id="y">

    <button onclick="invokeComputation()">Invoke computation on Server</button>

    <div id="result"></div>

    <script>
        function invokeComputation() {
            let x = document.getElementById("x").value;
            let y = document.getElementById("y").value;

            let url = `http://127.0.0.1:3001/?x=${x}&y=${y}`;

            fetch(url)
                .then((resp) => {
                    return resp.text();
                })
                .then((text) => {
                    document.getElementById("result").innerHTML = text;
                })
                .catch((error) => {
                    document.getElementById("result").innerHTML = "Request failed";
                });
        }
    </script>

</body>

</html>
